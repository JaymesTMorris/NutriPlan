
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grocery List | NutriPlan</title>

    <link rel="stylesheet" href="assets/css/home.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <nav class="navbar">

            <div class="logo">
                <img src="assets/images/logo.png" alt="NutriPlan Logo">
            </div>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="favorites.html">Favorites</a>
                <a href="grocery-list.html" class="active">Grocery List</a>
                <a href="login.html" class="login-btn">Login</a>
            </div>

        </nav>
    </header>

    <!-- Grocery List Header -->
    <section class="grocery-hero">
        <p class="eyebrow">PLAN YOUR NEXT SHOPPING TRIP</p>
        <h1>My <span>Grocery List</span></h1>

        <p>
            Plan your shopping, keep track of what you need,
            and help your family stay organized.
        </p>
    </section>

    <!-- Grocery List Content -->
    <main class="grocery-container">

        <section class="grocery-card">

            <h2>Add Grocery Items</h2>
            <p class="section-text">
                Add ingredients manually or from your favorite recipes.
            </p>

            <form id="groceryForm">
                <input
                    type="text"
                    id="groceryInput"
                    placeholder="Enter grocery item..."
                    required
                >
                <button type="submit">Add Item</button>
            </form>

            <p id="groceryMessage"></p>
            <ul id="groceryItems"></ul>

        </section>

    </main>

    <!-- Footer -->
    <footer>

        <div class="logo">
            <img src="assets/images/logo.png" alt="NutriPlan Logo">
        </div>

        <p>2026 NutriPlan</p>

    </footer>

<script>
const API = 'http://localhost:3000/api/grocery';
const form = document.getElementById('groceryForm');
const input = document.getElementById('groceryInput');
const list = document.getElementById('groceryItems');
const message = document.getElementById('groceryMessage');

// Automatically identify grocery categories
function getCategory(itemName) {
    const item = itemName.toLowerCase();

    const categories = {
        "Produce": [
            "apple", "banana", "orange", "avocado", "spinach",
            "lettuce", "tomato", "potato", "onion", "carrot",
            "broccoli", "cucumber", "pepper", "garlic", "lemon",
            "berry", "strawberry", "grape", "mushroom", "eggplant"
        ],

        "Meat & Seafood": [
            "chicken", "beef", "pork", "turkey", "salmon",
            "fish", "shrimp", "steak", "bacon", "sausage", "tuna"
        ],

        "Dairy & Eggs": [
            "milk", "cheese", "yogurt", "butter", "cream",
            "egg", "mozzarella", "cheddar"
        ],

        "Grains & Bakery": [
            "bread", "rice", "pasta", "flour", "oat",
            "cereal", "bagel", "tortilla", "quinoa"
        ]
    };

    for (const category in categories) {
        if (categories[category].some(food => item.includes(food))) {
            return category;
        }
    }

    return "Pantry & Other";
}

function getUser() {
    const saved = sessionStorage.getItem('nutriplanUser');
    return saved ? JSON.parse(saved) : null;
}

async function loadItems() {
    const user = getUser();

    if (!user) {
        message.textContent = 'Please log in first.';
        return;
    }

    try {
        const response = await fetch(`${API}/${user.id}`);
        const data = await response.json();

        if (!response.ok) throw new Error(data.error);

        list.innerHTML = '';

        // Group grocery items by category
        const groupedItems = {};

        data.items.forEach(item => {
            const category = getCategory(item.item_name);

            if (!groupedItems[category]) {
                groupedItems[category] = [];
            }

            groupedItems[category].push(item);
        });

        // Display categories in a consistent order
        const categoryOrder = [
            "Produce",
            "Meat & Seafood",
            "Dairy & Eggs",
            "Grains & Bakery",
            "Pantry & Other"
        ];

        categoryOrder.forEach(category => {

            if (!groupedItems[category]) return;

            // Category heading
            const heading = document.createElement('li');
            heading.textContent = category;
            heading.className = 'grocery-category';
            list.appendChild(heading);

            // Display items within category
            groupedItems[category].forEach(item => {

                const li = document.createElement('li');

                const check = document.createElement('input');
                check.type = 'checkbox';
                check.checked = Boolean(item.checked);

                check.onchange = async () => {
                    await fetch(`${API}/${user.id}/${item.id}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            checked: check.checked
                        })
                    });

                    loadItems();
                };

                const name = document.createElement('span');
                name.textContent = ' ' + item.item_name + ' ';

                const remove = document.createElement('button');
                remove.textContent = 'Remove';

                remove.onclick = async () => {
                    await fetch(`${API}/${user.id}/${item.id}`, {
                        method: 'DELETE'
                    });

                    loadItems();
                };

                li.append(check, name, remove);
                list.appendChild(li);
            });
        });

        message.textContent = data.items.length
            ? `${data.items.length} item(s) on your list.`
            : 'Your grocery list is empty.';

    } catch (error) {
        console.error(error);
        message.textContent = 'Could not load grocery list. Check your backend.';
    }
}

// Add grocery items
form.addEventListener('submit', async event => {
    event.preventDefault();

    const user = getUser();

    if (!user) {
        message.textContent = 'Please log in before adding items.';
        return;
    }

    try {
        const response = await fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                userId: user.id,
                itemName: input.value.trim()
            })
        });

        const data = await response.json();

        if (!response.ok) {
            message.textContent = data.error || 'Could not add item.';
            return;
        }

        input.value = '';
        loadItems();

    } catch (error) {
        message.textContent = 'Could not connect to the backend.';
    }
});

loadItems();
</script>
</body>
</html>
