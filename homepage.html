<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NutriPlan Login</title>
    <link rel="stylesheet" href="styleLogin.css">
    
</head>
<body>
   <!-- Nav Bar -->
    <header>
        <nav class="navbar">
            <div class="logo">
                <img src="Logo.png" alt="NutriPlan Logo">
            </div>
            <div class="nav-links">
                <a href="index.html">Home</a> 
                <a href="search.html">Search</a>
                <!--more links to be added such as Favorites, About  -->
                <a></a>
                <a></a>

            </div>
        </nav>
    </header>

<!--Hero Section  -->
    <section class="hero">

            <div class="hero-content">
                <h1>
                    Eat Healthy.<br>
                    Live Healthy.
                </h1>
                <p>
                    Discover delicious vegetarian recipes.
                </p>
    <!--Search box-->
                <div class="search-box">
                    <input
                        type= "text"
                        id="query"
                        placeholder="Search for a recipe.."
                    >
                    <button onclick="searchRecipes()">Search</button>
                </div>
            </div>
    </section>
    <!-- Features -->
    <section class="features">

        <h2>Explore NutriPlan</h2>
        
        <p class="section-text">
            we can add text here if needed.
        </p>
        
        <div class="feature-container">
            
            <div class="feature-card">
                
                <div class="feature-icon"></div>

                <h3>Find Recipes</h3>

                <p>
                    we can add text or image
                </p>
            </div>

            <div class="feature-card">
                
                <div class="feature-icon"></div>

                <h3>Nutrition Information</h3>

                <p>
                    we can add text or image
                </p>
            </div>


            <div class="feature-card">
                
                <div class="feature-icon"></div>

                <h3>Save & Rate</h3>

                <p>
                    Save your favorite recipes and rate them.
                </p>
            </div>

        </div>

    </section>
