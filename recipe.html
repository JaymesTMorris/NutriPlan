<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe - NutriPlan</title>
    <link rel="stylesheet" href="assets/css/recipe.css">
</head>
<body>
    <main class="recipe-page">
        <a class="back-link" href="index.html">&larr; Back to Home</a>

        <p class="loading-message" id="loading-message">Loading...</p>

        <article class="recipe" id="recipe" hidden>
            <h1 class="recipe-title" id="recipe-title"></h1>
            <img class="recipe-image" id="recipe-image" alt="">
            <p class="recipe-info" id="recipe-info"></p>
            <div class="recipe-summary" id="recipe-summary"></div>

            <h2 class="section-heading">Ingredients</h2>
            <ul class="ingredient-list" id="ingredient-list"></ul>

            <h2 class="section-heading">Instructions</h2>
            <ol class="instruction-list" id="instruction-list"></ol>
            <p class="instruction-text" id="instruction-text"></p>
        </article>
    </main>

    <script src="assets/js/recipe.js"></script>
</body>
</html>
